server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA 라우팅.
    # /products/123 같은 경로에는 대응하는 파일이 없다.
    # index.html 을 반환해야 React Router 가 경로를 처리할 수 있다.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite 가 파일명에 해시를 넣는다. 내용이 바뀌면 이름도 바뀌므로
    # 장기 캐싱해도 옛 파일을 받을 일이 없다.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # public/ 에서 복사된 파일은 해시가 없다.
    # 같은 이름으로 내용이 바뀔 수 있으므로 짧게 캐싱하고 재검증하게 한다.
    location /images/ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # index.html 은 캐싱하지 않는다.
    # 이 파일이 캐시되면 새 배포 후에도 옛 자산을 참조하게 된다.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}